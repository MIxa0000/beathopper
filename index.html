<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<title>Beat Hopper — ритм-игра по твоей песне</title>
<style>
:root{--bg:#0d0b1e;--fg:#f2f0ff;--ac:#ff3df2;--ac2:#27e8ff;--card:#1a1636;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none;position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.card{background:var(--card);border:1px solid #ffffff22;border-radius:20px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 60px #ff3df233}
h1{margin:0 0 6px;font-size:28px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:6px 0 14px;opacity:.8;font-size:14px;line-height:1.4}
.drop{border:2px dashed #ffffff55;border-radius:14px;padding:22px 10px;cursor:pointer;margin-bottom:12px}
.drop.on{border-color:var(--ac2);background:#27e8ff18}
.row{display:flex;gap:8px;margin-bottom:12px}
.row button,.go{flex:1;border:1px solid #ffffff33;background:#ffffff10;color:var(--fg);border-radius:10px;padding:10px 4px;font-size:14px;cursor:pointer}
.row button.sel{background:var(--ac);border-color:var(--ac);color:#fff}
.go{width:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border:0;font-weight:700;font-size:16px;padding:13px;color:#10102a}
.go:disabled{opacity:.35;cursor:default}
#st{font-size:13px;min-height:18px;margin-bottom:10px;opacity:.9}

#lib{max-height:max(120px,34vh);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;margin-bottom:10px;text-align:left}
.card{max-height:100%;overflow:auto;box-sizing:border-box}
.lh{font-size:12px;opacity:.6;margin:2px 0 6px}
.song{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #ffffff22;border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13px}
.song.sel{border-color:var(--ac2);background:#27e8ff15}
.song .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song small{display:block;opacity:.6;font-size:11px}
.song .x{background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
.ovl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,3,15,.65);z-index:5;padding:16px;box-sizing:border-box}
.ovl .card button{margin-bottom:10px}
#ui{flex-direction:column;gap:14px}
.ttl{margin:0;font-size:34px}
@media (max-height:520px){.ttl{font-size:22px}}
.sw{position:relative;display:flex;background:#ffffff12;border:1px solid #ffffff22;border-radius:999px;padding:3px;margin-bottom:12px;cursor:pointer}
.sw span{flex:1;z-index:1;padding:9px 0;font-size:14px;font-weight:700;color:var(--fg)}
.sw i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:transform .25s}
.sw.v i{transform:translateX(100%)}
.sw:not(.v) span:nth-of-type(1),.sw.v span:nth-of-type(2){color:#10102a}
.vr{display:flex;align-items:center;gap:10px;margin:6px 0 16px}.vr input{flex:1;accent-color:#ff3df2}
.song .ad{border:1px solid #ffffff33;background:#ffffff10;color:var(--fg);border-radius:8px;padding:5px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
.trs{margin:-2px 0 8px 12px;font-size:12px}.trs div{display:flex;align-items:center;gap:6px;padding:3px 0}
.trs span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.trs button{background:none;border:0;color:#fff;opacity:.7;font-size:15px;cursor:pointer;padding:2px 6px}
</style></head><body>
<canvas id="c"></canvas>

<div id="ui"><h1 class="ttl">Beat Hopper</h1><div class="card">
<div class="sw" id="sw"><i></i><span>🎵 Песни</span><span>💿 Альбомы</span></div>
<div class="drop" id="drop">🎵 <span id="fn">Выбрать песню</span></div>
<input type="file" id="file" accept="audio/*" multiple hidden><input type="file" id="fileAdd" accept="audio/*" multiple hidden>
<div class="row" id="diff"><button data-d="0">Лёгкий</button><button data-d="1" class="sel">Средний</button><button data-d="2">Сложный</button><button data-d="3">Безумие</button></div>
<div id="lib"></div><div id="st"></div>
<button class="go" id="go" disabled>Играть</button>
</div></div>
<div class="ovl" id="pz"><div class="card"><h1>Пауза</h1><div class="vr">🔊 <input type="range" id="vol" min="0" max="1" step="0.01"></div><button class="go" id="pr">▶ Продолжить</button><br><br><button class="go" id="pa" style="background:#ffffff18;color:#fff">↻ Заново</button><br><br><button class="go" id="pm" style="background:#ffffff18;color:#fff">☰ В меню</button></div></div>
<div class="ovl" id="cf" style="z-index:8"><div class="card"><p id="cft" style="font-size:16px;opacity:1;margin:0 0 14px"></p><button class="go" id="cfy">Удалить</button><br><br><button class="go" id="cfn" style="background:#ffffff18;color:#fff">Отмена</button></div></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');let W,H,dpr;
function rs(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();
const AC=new (window.AudioContext||window.webkitAudioContext)();
const gain=AC.createGain();gain.connect(AC.destination);let vol=1;try{const v=localStorage.getItem('bh_vol');if(v!==null)vol=+v}catch(e){}
gain.gain.value=vol;$('vol').value=vol;$('vol').oninput=e=>{vol=+e.target.value;gain.gain.value=vol;try{localStorage.setItem('bh_vol',vol)}catch(_){}};
let buf=null,diff=1,P=[],state='menu',src=null,an=null,fd=null,score=0,combo=0,maxCombo=0;
try{const d=localStorage.getItem('bh_diff');if(d!==null)diff=Math.max(0,Math.min(3,+d||0))}catch(e){}
const GAPS=[.4,.28,.2,.2],SENS=[1.5,1.3,1.15,1.15];
let amode=false;try{amode=localStorage.getItem('bh_amode')==='1'}catch(e){}
let addTo=null;
let NL=3,curId=null,curRec=null,spd=1,accelUntil=0,bannerTxt='УСКОРЕНИЕ',crowned=false,rbH=0,alb=null,albFirst=null,missTot=0;
const isAud=f=>/^audio\//.test(f.type)||/\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|wma)$/i.test(f.name);
const remember=id=>{try{localStorage.setItem('bh_last',String(id))}catch(e){}};
document.querySelectorAll('#diff button').forEach(b=>{b.classList.toggle('sel',+b.dataset.d===diff);b.onclick=()=>{diff=+b.dataset.d;try{localStorage.setItem('bh_diff',diff)}catch(e){}document.querySelectorAll('#diff button').forEach(x=>x.classList.toggle('sel',x===b));if(curRec&&curRec.album)pickAlbum(curId);else if(buf)analyze();refresh()}});
$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{const fl=Array.from(e.target.files);e.target.value='';load(fl)};
['dragover','dragenter'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('on')}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('on')}));
$('drop').addEventListener('drop',e=>load(Array.from(e.dataTransfer.files)));
function setMode(a){amode=a;$('sw').classList.toggle('v',a);$('fn').textContent=a?'Создать альбом':'Выбрать песню';try{localStorage.setItem('bh_amode',a?'1':'0')}catch(e){}
  if(curRec&&!!curRec.album!==a){curId=null;curRec=null;buf=null;token++;$('go').disabled=true;$('st').textContent=''}refresh()}
$('sw').onclick=()=>setMode(!amode);
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dbp=new Promise(res=>{try{const r=indexedDB.open('beathopper',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const tx=async(mode,fn)=>{const d=await dbp;if(!d)return null;return new Promise(res=>{try{const t=d.transaction('songs',mode),rq=fn(t.objectStore('songs'));t.oncomplete=()=>res(rq?rq.result:null);t.onerror=t.onabort=()=>res(null)}catch(e){res(null)}})};
const dbAll=()=>tx('readonly',s=>s.getAll()),dbGet=id=>tx('readonly',s=>s.get(id)),dbPut=r=>tx('readwrite',s=>s.put(r)),dbDel=id=>tx('readwrite',s=>s.delete(id));
const abest=id=>{try{return(JSON.parse(localStorage.getItem('bh_alb')||'{}')[id]||{})[diff]||null}catch(e){return null}};
const abestSet=(id,df,n,sc)=>{try{const m=JSON.parse(localStorage.getItem('bh_alb')||'{}');m[id]=m[id]||{};const o=m[id][df]||{n:0,s:0};m[id][df]={n:Math.max(o.n,n),s:Math.max(o.s,sc)};localStorage.setItem('bh_alb',JSON.stringify(m))}catch(e){}};
async function refresh(){
  const all=(await dbAll())||[],el=$('lib');if(!el)return;curRec=all.find(r=>r.id===curId)||curRec;
  const L=all.filter(r=>amode?r.album:(!r.album&&!r.video));
  el.innerHTML=L.length?'<div class="lh">'+(amode?'Мои альбомы':'Мои песни')+'</div>':'';
  L.sort((a,b)=>b.added-a.added).forEach(r=>{const d=document.createElement('div');d.className='song'+(r.id===curId?' sel':'');let h;
    if(r.album){const mb=r.tracks.reduce((q,t)=>q+t.size,0)/1048576,ab=abest(r.id);
      h='<span class="nm">💿 '+esc(r.name)+'<small>'+r.tracks.length+' песен · '+mb.toFixed(1)+' МБ'+(ab?' · лучший: '+ab.n+'/'+r.tracks.length:'')+'</small><small>'+esc(r.tracks.map(t=>t.name.replace(/\.[^.]+$/,'')).join(', '))+'</small></span>'}
    else{const cl=(r.clears&&r.clears[diff])||0,bst=(r.best&&r.best[diff]?' · рекорд '+r.best[diff]:'')+(((r.bs&&r.bs[diff])||0)>1?' · скорость ×'+r.bs[diff]:'');
      h='<span class="nm">'+(cl?'👑':'🎵')+' '+esc(r.name)+'<small>'+(r.size/1048576).toFixed(1)+' МБ'+bst+'</small></span>'}
    d.innerHTML=h+(r.album?'<button class="ad" title="Добавить песню">+ песня</button>':'')+'<button class="x" title="Удалить">🗑</button>';
    d.onclick=()=>r.album?pickAlbum(r.id):pick(r.id);
    d.querySelector('.x').onclick=async e=>{e.stopPropagation();if(await ask('Удалить из памяти игры: '+r.name+'?'))delRec(r)};
    if(r.album)d.querySelector('.ad').onclick=e=>{e.stopPropagation();addTo=r.id;$('fileAdd').click()};
    el.appendChild(d);
    if(r.album&&r.id===curId){const tl=document.createElement('div');tl.className='trs';tl.onclick=e=>e.stopPropagation();
      r.tracks.forEach((t,i)=>{const row=document.createElement('div');row.innerHTML='<span>'+(i+1)+'. '+esc(t.name.replace(/\.[^.]+$/,''))+'</span><button title="Убрать из альбома">✕</button>';row.querySelector('button').onclick=()=>rmTrack(r,i);tl.appendChild(row)});el.appendChild(tl)}
  })}
const ask=msg=>new Promise(res=>{$('cft').textContent=msg;$('cf').style.display='flex';const done=v=>{$('cf').style.display='none';res(v)};$('cfy').onclick=()=>done(true);$('cfn').onclick=()=>done(false)});
async function delRec(r){await dbDel(r.id);if(curId===r.id){curId=null;curRec=null;buf=null;albFirst=null;token++;$('go').disabled=true;$('st').textContent=''}refresh()}
async function rmTrack(r,i){
  if(r.tracks.length<2){if(await ask('В альбоме одна песня. Удалить весь альбом?'))delRec(r);return}
  if(!await ask('Убрать из альбома: '+r.tracks[i].name+'?'))return;
  r.tracks.splice(i,1);await dbPut(r);if(curId===r.id)await pickAlbum(r.id);else refresh()}
$('fileAdd').onchange=async e=>{const fl=Array.from(e.target.files).filter(isAud);e.target.value='';if(!fl.length||addTo===null)return;
  const id=addTo;addTo=null;const r=await dbGet(id);if(!r||!r.album)return;let n=0;
  for(const f of fl)if(!r.tracks.some(t=>t.name===f.name&&t.size===f.size)){r.tracks.push({name:f.name,size:f.size,blob:f});n++}
  if(!n){$('st').textContent='Эти песни уже есть в альбоме';return}
  await dbPut(r);if(curId===id)curRec=r;$('st').textContent='Добавлено песен: '+n;refresh()};
async function decodeBlob(blob){try{return await AC.decodeAudioData(await blob.arrayBuffer())}catch(e){return null}}
async function decodeAnalyze(blob){$('go').disabled=true;$('st').textContent='Декодирую аудио…';buf=null;const b=await decodeBlob(blob);
  if(!b){$('st').textContent='Не удалось прочитать файл 😕';return false}buf=b;await analyze();return true}
async function pick(id){const r=await dbGet(id);if(!r||r.album)return false;curId=id;curRec=r;albFirst=null;remember(id);$('fn').textContent=r.name;const ok=await decodeAnalyze(r.blob);refresh();return ok}
// первая подходящая песня альбома, начиная с from (для фоновой подгрузки следующей)
async function loadTrack(tracks,from,df,bg){let skips=0;
  for(let i=from;i<tracks.length;i++){const b=await decodeBlob(tracks[i].blob);
    if(b){const r=await build(b,df,null,undefined,bg);if(r&&r.P.length>=6)return{idx:i,buf:b,P:r.P,NL:r.NL,skips}}skips++}
  return null}
async function pickAlbum(id){const r=await dbGet(id);if(!r||!r.album)return false;curId=id;curRec=r;albFirst=null;remember(id);$('fn').textContent=r.name;$('go').disabled=true;
  const my=++token;let skips=0;$('st').textContent='Декодирую аудио…';
  for(let i=0;i<r.tracks.length;i++){const b=await decodeBlob(r.tracks[i].blob);if(my!==token)return false;
    if(b){const nm=r.tracks[i].name.replace(/\.[^.]+$/,'').slice(0,24),res=await build(b,diff,pr=>{$('st').textContent='Анализирую: '+nm+' '+Math.round(pr*100)+'%'},my);if(!res)return false;
      if(res.P.length>=6){buf=b;P=res.P;NL=res.NL;albFirst={idx:i,buf:b,P,NL,skips};$('st').textContent='';$('go').disabled=false;refresh();return true}}
    skips++}
  $('st').textContent='В альбоме нет подходящих песен 🤔';refresh();return false}
async function load(files){
  const fl=(files||[]).filter(isAud);
  if(!fl.length){$('st').textContent='Нужен аудиофайл';return}
  if(amode){const all=(await dbAll())||[],n=all.filter(r=>r.album).length+1;
    const id=await dbPut({album:true,name:'Альбом '+n,added:Date.now(),tracks:fl.map(f=>({name:f.name,size:f.size,blob:f})),best:{}});
    if(id==null){$('st').textContent='Не удалось сохранить альбом';return}
    await pickAlbum(id);return}
  const L=(await dbAll())||[];let first=null,firstNew=false;
  for(let i=0;i<fl.length;i++){const f=fl[i],ex=L.find(r=>!r.album&&r.name===f.name&&r.size===f.size);let id;
    if(ex)id=ex.id;else{id=await dbPut({name:f.name,size:f.size,blob:f,added:Date.now()-i,best:{}});if(first===null)firstNew=true}
    if(first===null)first=id}
  if(first===null){$('fn').textContent=fl[0].name;await decodeAnalyze(fl[0]);return}
  const ok=await pick(first);if(!ok&&firstNew){await dbDel(first);curId=null;curRec=null;buf=null;refresh();return}
  if(fl.length>1)$('st').textContent='Добавлено файлов: '+fl.length}
async function saveBest(win){if(!curId)return;
  if(alb){abestSet(curId,diff,alb.passed+(win?1:0),score);return}
  if(win&&curRec){curRec.clears=curRec.clears||{};curRec.bs=curRec.bs||{};curRec.clears[diff]=1;curRec.bs[diff]=Math.max(curRec.bs[diff]||0,spd)}
  const r=await dbGet(curId);if(!r)return;r.best=r.best||{};if((r.best[diff]||0)<score)r.best[diff]=score;
  if(curRec){if(curRec.clears)r.clears=curRec.clears;if(curRec.bs)r.bs=curRec.bs}await dbPut(r)}
setMode(amode);
(async()=>{const all=(await dbAll())||[];for(const r of all)if(r.video)dbDel(r.id);try{indexedDB.deleteDatabase('bh_aud')}catch(e){}})();
// FFT
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
 for(let l=2;l<=n;l<<=1){const a=-2*Math.PI/l,wr=Math.cos(a),wi=Math.sin(a);for(let i=0;i<n;i+=l){let cr=1,ci=0;for(let k=0;k<l/2;k++){const u=i+k,v=u+l/2,xr=re[v]*cr-im[v]*ci,xi=re[v]*ci+im[v]*cr;re[v]=re[u]-xr;im[v]=im[u]-xi;re[u]+=xr;im[u]+=xi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}
let token=0;
async function build(bf,df,prog,my,bg){
  const NLb=[2,3,5,7][df];
  const N=1024,HOP=512,sr=bf.sampleRate,ch0=bf.getChannelData(0),ch1=bf.numberOfChannels>1?bf.getChannelData(1):ch0;
  const frames=Math.floor((ch0.length-N)/HOP),flux=new Float32Array(frames),cen=new Float32Array(frames),CH=new Float32Array(frames*12),PC=new Int8Array(N/2);
  for(let k=7;k<120;k++)PC[k]=((Math.round(12*Math.log2(k*sr/N/440))+69)%12+12)%12;
  const re=new Float32Array(N),im=new Float32Array(N),win=new Float32Array(N).map((_,i)=>.5-.5*Math.cos(2*Math.PI*i/N));
  let prev=new Float32Array(N/2);
  for(let f=0;f<frames;f++){
    if(f%(bg?200:1500)==0){if(prog)prog(f/frames);await new Promise(r=>setTimeout(r,bg?6:0));if(my!==undefined&&my!==token)return null}
    const o=f*HOP;for(let i=0;i<N;i++){re[i]=(ch0[o+i]+ch1[o+i])*.5*win[i];im[i]=0}
    fft(re,im);let fl=0,sm=0,sk=0;
    for(let k=1;k<N/2;k++){const mg=Math.hypot(re[k],im[k]),m=Math.log1p(10*mg/16);if(k>=7&&k<120)CH[f*12+PC[k]]+=mg;const d=m-prev[k];if(d>0&&k<300)fl+=d;prev[k]=m;if(k<200){sm+=m;sk+=m*k}}
    flux[f]=fl;cen[f]=sm>0?sk/sm:0;
  }
  // peak picking
  const W2=34,cand=[];
  for(let i=3;i<frames-3;i++){
    let s=0,c=0;for(let j=Math.max(0,i-W2);j<Math.min(frames,i+W2);j++){s+=flux[j];c++}
    const thr=s/c*SENS[df]+.4;let ok=flux[i]>thr;
    for(let j=i-3;j<=i+3&&ok;j++)if(flux[j]>flux[i])ok=false;
    if(ok)cand.push({t:(i*HOP+N/2)/sr-.012,s:flux[i],c:cen[i]});
  }
  const out=[];
  for(const p of cand){const l=out[out.length-1];if(l&&p.t-l.t<GAPS[df]){if(p.s>l.s)out[out.length-1]=p}else out.push(p)}
  // протяжные ноты: устойчивый доминирующий тон дольше MINL секунд
  const fps=sr/HOP,R=10,tmp=new Float32Array(2*R+1),MED=new Float32Array(frames*12),dm=new Float32Array(frames),ldn=new Float32Array(frames);
  for(let f=0;f<frames;f++){let tot=0,mx=0;for(let j=0;j<12;j++){for(let q=-R;q<=R;q++)tmp[q+R]=CH[Math.min(frames-1,Math.max(0,f+q))*12+j];tmp.sort();const c=tmp[R];MED[f*12+j]=c;tot+=c;if(c>mx)mx=c}ldn[f]=tot;dm[f]=tot>0?mx/tot:0}
